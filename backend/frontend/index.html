<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedOps Agent - 智能渗透测试助手</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d97e;
            --primary-dark: #00b368;
            --bg-dark: #0d1117;
            --bg-card: #161b22;
            --bg-input: #21262d;
            --border: #30363d;
            --text: #c9d1d9;
            --text-muted: #8b949e;
            --danger: #f85149;
            --warning: #d29922;
            --success: #3fb950;
            --info: #58a6ff;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }
        
        .app-container {
            display: flex;
            height: 100vh;
        }
        
        /* 简洁侧边栏 */
        .sidebar {
            width: 220px;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 16px 12px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            margin-bottom: 24px;
        }
        
        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary), #00a86b);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            color: white;
        }
        
        .logo-text {
            font-size: 18px;
            font-weight: 700;
            color: white;
        }
        
        .sidebar-section {
            margin-bottom: 20px;
        }
        
        .sidebar-title {
            font-size: 10px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
            padding: 0 12px;
            letter-spacing: 0.5px;
        }
        
        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text);
            font-size: 13px;
        }
        
        .sidebar-item:hover {
            background: var(--bg-input);
        }
        
        .sidebar-item.active {
            background: rgba(0, 217, 126, 0.15);
            color: var(--primary);
        }
        
        .sidebar-item-icon {
            width: 16px;
            height: 16px;
            opacity: 0.8;
        }
        
        .sidebar-badge {
            margin-left: auto;
            background: var(--primary);
            color: #000;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: 600;
        }
        
        /* 主内容区 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-dark);
        }
        
        /* 顶部栏 */
        .header {
            height: 56px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }
        
        .header-title {
            font-size: 15px;
            font-weight: 600;
            color: white;
        }
        
        .header-status {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
        }
        
        .status-text {
            font-size: 12px;
            color: var(--text-muted);
        }
        
        /* 对话区域 */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }
        
        .message {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            flex-shrink: 0;
        }
        
        .message-avatar.user {
            background: var(--bg-input);
            color: var(--text);
        }
        
        .message-avatar.assistant {
            background: linear-gradient(135deg, var(--primary), #00a86b);
            color: white;
        }
        
        .message-content {
            flex: 1;
            max-width: 700px;
        }
        
        .message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        
        .message-name {
            font-weight: 600;
            font-size: 14px;
            color: white;
        }
        
        .message-time {
            font-size: 12px;
            color: var(--text-muted);
        }
        
        .message-text {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text);
        }
        
        .message-text code {
            background: var(--bg-input);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Consolas', monospace;
            font-size: 13px;
        }
        
        /* 输入区 */
        .input-container {
            padding: 16px 24px 20px;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
        }
        
        .input-wrapper {
            display: flex;
            gap: 12px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 16px;
            transition: border-color 0.2s;
        }
        
        .input-wrapper:focus-within {
            border-color: var(--primary);
        }
        
        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 14px;
            resize: none;
            outline: none;
            font-family: inherit;
            max-height: 120px;
        }
        
        .chat-input::placeholder {
            color: var(--text-muted);
        }
        
        .send-btn {
            background: var(--primary);
            border: none;
            border-radius: 8px;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .send-btn:hover {
            background: var(--primary-dark);
        }
        
        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* 欢迎页面 */
        .welcome-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        
        .welcome-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary), #00a86b);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 700;
            color: white;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(0, 217, 126, 0.3);
        }
        
        .welcome-title {
            font-size: 28px;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
        }
        
        .welcome-subtitle {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 32px;
            text-align: center;
        }
        
        .welcome-input-wrapper {
            width: 100%;
            max-width: 600px;
            position: relative;
        }
        
        .welcome-input {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            padding-right: 50px;
            color: var(--text);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        
        .welcome-input:focus {
            border-color: var(--primary);
        }
        
        .welcome-input::placeholder {
            color: var(--text-muted);
        }
        
        .welcome-send {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--primary);
            border: none;
            border-radius: 8px;
            width: 36px;
            height: 36px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .welcome-send:hover {
            background: var(--primary-dark);
        }
        
        /* 加载动画 */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 0;
        }
        
        .typing-dot {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }
        
        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }
        
        /* 技能卡片 */
        .skills-panel {
            display: none;
            padding: 24px;
            overflow-y: auto;
        }
        
        .skills-panel.active {
            display: block;
        }
        
        .skill-category {
            margin-bottom: 24px;
        }
        
        .skill-category-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .skill-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }
        
        .skill-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .skill-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }
        
        .skill-card-title {
            font-weight: 600;
            color: white;
            margin-bottom: 4px;
            font-size: 14px;
        }
        
        .skill-card-desc {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.4;
        }
        
        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        
        /* 响应式 */
        @media (max-width: 768px) {
            .sidebar {
                width: 60px;
                padding: 12px 8px;
            }
            
            .logo-text, .sidebar-title, .sidebar-item span {
                display: none;
            }
            
            .sidebar-item {
                justify-content: center;
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 简洁侧边栏 -->
        <div class="sidebar">
            <div class="logo">
                <div class="logo-icon">R</div>
                <div class="logo-text">RedOps</div>
            </div>
            
            <div class="sidebar-section">
                <div class="sidebar-title">导航</div>
                <div class="sidebar-item active" onclick="switchView('chat')" id="nav-chat">
                    <svg class="sidebar-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <span>对话助手</span>
                </div>
            </div>
            
            <div class="sidebar-section">
                <div class="sidebar-title">技能</div>
                <div class="sidebar-item" onclick="switchView('skills')">
                    <svg class="sidebar-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                        <polyline points="2 17 12 22 22 17"></polyline>
                        <polyline points="2 12 12 17 22 12"></polyline>
                    </svg>
                    <span>技能市场</span>
                </div>
                <div class="sidebar-item" onclick="switchView('targets')">
                    <svg class="sidebar-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <circle cx="12" cy="12" r="6"></circle>
                        <circle cx="12" cy="12" r="2"></circle>
                    </svg>
                    <span>目标管理</span>
                </div>
                <div class="sidebar-item" onclick="switchView('scans')">
                    <svg class="sidebar-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                    </svg>
                    <span>扫描记录</span>
                </div>
            </div>
            
            <div class="sidebar-section" style="margin-top: auto;">
                <div class="sidebar-title">系统</div>
                <div class="sidebar-item" onclick="switchView('config')">
                    <svg class="sidebar-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                    <span>设置</span>
                </div>
                <div class="sidebar-item">
                    <div class="status-dot"></div>
                    <span style="font-size: 12px; color: var(--text-muted);">系统在线</span>
                </div>
            </div>
        </div>
        
        <!-- 主内容区 -->
        <div class="main-content">
            <div class="header">
                <div class="header-title" id="pageTitle">智能对话</div>
                <div class="header-status">
                    <div class="status-text" id="llmStatus">LLM: 已连接</div>
                </div>
            </div>
            
            <!-- 对话视图 -->
            <div class="chat-container" id="chatView">
                <!-- 欢迎页 -->
                <div class="welcome-container" id="welcomeScreen">
                    <div class="welcome-icon">R</div>
                    <div class="welcome-title">RedOps Agent</div>
                    <div class="welcome-subtitle">智能渗透测试助手 - 告诉我您要测试的目标</div>
                    <div class="welcome-input-wrapper">
                        <input type="text" class="welcome-input" id="welcomeInput" 
                               placeholder="例如：扫描 example.com 的漏洞" 
                               onkeypress="if(event.key==='Enter')sendWelcomeMessage()">
                        <button class="welcome-send" onclick="sendWelcomeMessage()">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </button>
                    </div>
                </div>
                
                <!-- 聊天消息区 -->
                <div class="chat-messages" id="chatMessages" style="display: none;"></div>
                
                <!-- 输入区 -->
                <div class="input-container" id="inputContainer" style="display: none;">
                    <div class="input-wrapper">
                        <textarea class="chat-input" id="chatInput" 
placeholder="输入您的问题或指令..." 
                                  rows="1"
                                  oninput="autoResize()"
                                  onkeypress="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
                        <button class="send-btn" onclick="sendMessage()">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- 技能视图 -->
            <div class="skills-panel" id="skillsView">
                <div id="skillsContainer">
                    <!-- 技能将动态加载 -->
                </div>
            </div>
            
            <!-- 目标管理视图 -->
            <div class="skills-panel" id="targetsView">
                <h3 style="margin-bottom: 16px; color: white;">目标管理</h3>
                <p style="color: var(--text-muted);">从侧边栏访问完整功能</p>
            </div>
            
            <!-- 扫描记录视图 -->
            <div class="skills-panel" id="scansView">
                <h3 style="margin-bottom: 16px; color: white;">扫描记录</h3>
                <p style="color: var(--text-muted);">从侧边栏访问完整功能</p>
            </div>
            
            <!-- 设置视图 -->
            <div class="skills-panel" id="configView">
                <h3 style="margin-bottom: 16px; color: white;">系统设置</h3>
                <p style="color: var(--text-muted);">从侧边栏访问完整功能</p>
            </div>
        </div>
    </div>
    
    <script>
        let messages = [];
        let sessionId = null;
        let isTyping = false;
        let currentView = 'chat';
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            checkLLMStatus();
            loadSkills();
        });
        
        async function checkLLMStatus() {
            try {
                const response = await fetch('/api/config/llm/status');
                const data = await response.json();
                
                if (data.ready) {
                    document.getElementById('llmStatus').textContent = `LLM: ${data.model} 已连接`;
                } else {
                    document.getElementById('llmStatus').textContent = 'LLM: 未连接';
                }
            } catch (e) {
                document.getElementById('llmStatus').textContent = 'LLM: 未连接';
            }
        }
        
        async function loadSkills() {
            try {
                const response = await fetch('/api/skills/');
                const data = await response.json();
                
                const container = document.getElementById('skillsContainer');
                let html = '';
                
                for (const category of data.categories) {
                    const categorySkills = data.skills.filter(s => s.category === category);
                    
                    html += `<div class="skill-category">
                        <div class="skill-category-title">${getCategoryName(category)}</div>
                        <div class="skill-grid">`;
                    
                    for (const skill of categorySkills) {
                        html += `<div class="skill-card" onclick="executeSkill('${skill.name}')">
                            <div class="skill-card-title">${skill.name}</div>
                            <div class="skill-card-desc">${skill.description}</div>
                        </div>`;
                    }
                    
                    html += '</div></div>';
                }
                
                container.innerHTML = html;
            } catch (e) {
                console.error('Failed to load skills:', e);
            }
        }
        
        function getCategoryName(category) {
            const names = {
                'scan': '扫描技能',
                'recon': '侦察技能',
                'analyze': '分析技能',
                'exploit': '利用技能',
                'identify': '识别技能',
                'util': '工具技能',
                'general': '通用技能'
            };
            return names[category] || category;
        }
        
        function switchView(view) {
            currentView = view;
            
            // 更新侧边栏
            document.querySelectorAll('.sidebar-item').forEach(item => item.classList.remove('active'));
            const navItem = document.getElementById(`nav-${view}`);
            if (navItem) navItem.classList.add('active');
            
            // 更新页面标题
            const titles = {
                'chat': '智能对话',
                'skills': '技能市场',
                'targets': '目标管理',
                'scans': '扫描记录',
                'config': '系统设置'
            };
            document.getElementById('pageTitle').textContent = titles[view] || 'RedOps';
            
            // 切换视图
            document.getElementById('chatView').style.display = view === 'chat' ? 'flex' : 'none';
            document.getElementById('skillsView').classList.toggle('active', view === 'skills');
            document.getElementById('targetsView').classList.toggle('active', view === 'targets');
            document.getElementById('scansView').classList.toggle('active', view === 'scans');
            document.getElementById('configView').classList.toggle('active', view === 'config');
        }
        
        function sendWelcomeMessage() {
            const input = document.getElementById('welcomeInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            // 切换到聊天视图
            document.getElementById('welcomeScreen').style.display = 'none';
            document.getElementById('chatMessages').style.display = 'block';
            document.getElementById('inputContainer').style.display = 'block';
            
            // 发送消息
            document.getElementById('chatInput').value = message;
            sendMessage();
        }
        
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message || isTyping) return;
            
            // 显示聊天界面
            document.getElementById('welcomeScreen').style.display = 'none';
            document.getElementById('chatMessages').style.display = 'block';
            document.getElementById('inputContainer').style.display = 'block';
            
            addMessage('user', message);
            input.value = '';
            input.style.height = 'auto';
            
            // 显示加载状态
            isTyping = true;
            showTyping();
            scrollToBottom();
            
            try {
                const response = await fetch('/api/chat/message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message,
                        session_id: sessionId
                    })
                });
                
                const data = await response.json();
                hideTyping();
                
                sessionId = data.session_id;
                addMessage('assistant', data.message);
                
                scrollToBottom();
            } catch (error) {
                hideTyping();
                addMessage('assistant', '抱歉，发生了错误：' + error.message);
            }
            
            isTyping = false;
        }
        
        function addMessage(role, content) {
            const messagesContainer = document.getElementById('chatMessages');
            const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            messageDiv.innerHTML = `
                <div class="message-avatar ${role}">
                    ${role === 'user' ? 'U' : 'R'}
                </div>
                <div class="message-content">
                    <div class="message-header">
                        <span class="message-name">${role === 'user' ? '您' : 'RedOps'}</span>
                        <span class="message-time">${time}</span>
                    </div>
                    <div class="message-text">${formatContent(content)}</div>
                </div>
            `;
            
            messagesContainer.appendChild(messageDiv);
            messages.push({ role, content, time });
        }
        
        function formatContent(content) {
            return content
                .replace(/\n/g, '<br>')
                .replace(/`(.*?)`/g, '<code>$1</code>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        }
        
        function showTyping() {
            const messagesContainer = document.getElementById('chatMessages');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = `
                <div class="message-avatar assistant">R</div>
                <div class="message-content">
                    <div class="typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            `;
            messagesContainer.appendChild(typingDiv);
        }
        
        function hideTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }
        
        function scrollToBottom() {
            const container = document.getElementById('chatMessages');
            container.scrollTop = container.scrollHeight;
        }
        
        function autoResize() {
            const input = document.getElementById('chatInput');
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 120) + 'px';
        }
        
        async function executeSkill(skillName) {
            // 提示用户输入参数
            const target = prompt(`执行 ${skillName}\n请输入目标地址:`);
            if (!target) return;
            
            try {
                const response = await fetch(`/api/skills/${skillName}/execute`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target: target })
                });
                
                const data = await response.json();
                alert(`执行完成: ${JSON.stringify(data, null, 2)}`);
            } catch (e) {
                alert('执行失败: ' + e.message);
            }
        }
    </script>
</body>
</html>
