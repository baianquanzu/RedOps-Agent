<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedOps Agent - 智能渗透测试助手</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {--primary: #00d97e;--primary-dark: #00b368;--bg-dark: #0d1117;--bg-card: #161b22;--bg-input: #21262d;--border: #30363d;--text: #c9d1d9;--text-muted: #8b949e;--danger: #f85149;--success: #3fb950;--info: #58a6ff;}
        * {margin: 0;padding: 0;box-sizing: border-box;}
        body {font-family: 'Inter', -apple-system, sans-serif;background: var(--bg-dark);color: var(--text);height: 100vh;overflow: hidden;}
        .app-container {display: flex;height: 100vh;}
        .sidebar {width: 220px;background: var(--bg-card);border-right: 1px solid var(--border);display: flex;flex-direction: column;padding: 16px 12px;}
        .logo {display: flex;align-items: center;gap: 10px;padding: 8px 12px;margin-bottom: 24px;}
        .logo-icon {width: 32px;height: 32px;background: linear-gradient(135deg, var(--primary), #00a86b);border-radius: 8px;display: flex;align-items: center;justify-content: center;font-weight: 700;color: white;}
        .logo-text {font-size: 18px;font-weight: 700;color: white;}
        .sidebar-section {margin-bottom: 20px;}
        .sidebar-title {font-size: 10px;text-transform: uppercase;color: var(--text-muted);margin-bottom: 8px;padding: 0 12px;letter-spacing: 0.5px;}
        .sidebar-item {display: flex;align-items: center;gap: 10px;padding: 10px 12px;border-radius: 6px;cursor: pointer;transition: all 0.2s;color: var(--text);font-size: 13px;}
        .sidebar-item:hover {background: var(--bg-input);}
        .sidebar-item.active {background: rgba(0, 217, 126, 0.15);color: var(--primary);}
        .main-content {flex: 1;display: flex;flex-direction: column;background: var(--bg-dark);}
        .header {height: 56px;background: var(--bg-card);border-bottom: 1px solid var(--border);display: flex;align-items: center;justify-content: space-between;padding: 0 24px;}
        .header-title {font-size: 15px;font-weight: 600;color: white;}
        .header-status {display: flex;align-items: center;gap: 16px;}
        .status-dot {width: 8px;height: 8px;background: var(--success);border-radius: 50%;}
        .status-text {font-size: 12px;color: var(--text-muted);}
        .chat-container {flex: 1;display: flex;flex-direction: column;overflow: hidden;}
        .chat-messages {flex: 1;overflow-y: auto;padding: 24px;}
        .message {display: flex;gap: 12px;margin-bottom: 20px;animation: fadeIn 0.3s ease;}
        @keyframes fadeIn {from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); }}
        .message-avatar {width: 36px;height: 36px;border-radius: 8px;display: flex;align-items: center;justify-content: center;font-weight: 600;font-size: 14px;flex-shrink: 0;}
        .message-avatar.user {background: var(--bg-input);color: var(--text);}
        .message-avatar.assistant {background: linear-gradient(135deg, var(--primary), #00a86b);color: white;}
        .message-content {flex: 1;max-width: 700px;}
        .message-header {display: flex;align-items: center;gap: 8px;margin-bottom: 6px;}
        .message-name {font-weight: 600;font-size: 14px;color: white;}
        .message-time {font-size: 12px;color: var(--text-muted);}
        .message-text {font-size: 14px;line-height: 1.6;color: var(--text);}
        .message-text code {background: var(--bg-input);padding: 2px 6px;border-radius: 4px;font-family: monospace;font-size: 13px;}
        .input-container {padding: 16px 24px 20px;background: var(--bg-card);border-top: 1px solid var(--border);}
        .input-wrapper {display: flex;gap: 12px;background: var(--bg-input);border: 1px solid var(--border);border-radius: 12px;padding: 12px 16px;transition: border-color 0.2s;}
        .input-wrapper:focus-within {border-color: var(--primary);}
        .chat-input {flex: 1;background: transparent;border: none;color: var(--text);font-size: 14px;resize: none;outline: none;font-family: inherit;max-height: 120px;}
        .chat-input::placeholder {color: var(--text-muted);}
        .send-btn {background: var(--primary);border: none;border-radius: 8px;width: 40px;height: 40px;cursor: pointer;display: flex;align-items: center;justify-content: center;transition: all 0.2s;}
        .send-btn:hover {background: var(--primary-dark);}
        .welcome-container {flex: 1;display: flex;flex-direction: column;align-items: center;justify-content: center;padding: 40px;}
        .welcome-icon {width: 80px;height: 80px;background: linear-gradient(135deg, var(--primary), #00a86b);border-radius: 20px;display: flex;align-items: center;justify-content: center;font-size: 36px;font-weight: 700;color: white;margin-bottom: 24px;box-shadow: 0 8px 32px rgba(0, 217, 126, 0.3);}
        .welcome-title {font-size: 28px;font-weight: 700;color: white;margin-bottom: 8px;}
        .welcome-subtitle {font-size: 15px;color: var(--text-muted);margin-bottom: 32px;}
        .welcome-input-wrapper {width: 100%;max-width: 600px;position: relative;}
        .welcome-input {width: 100%;background: var(--bg-card);border: 1px solid var(--border);border-radius: 12px;padding: 16px 20px;padding-right: 50px;color: var(--text);font-size: 15px;outline: none;}
        .welcome-input:focus {border-color: var(--primary);}
        .welcome-input::placeholder {color: var(--text-muted);}
        .welcome-send {position: absolute;right: 8px;top: 50%;transform: translateY(-50%);background: var(--primary);border: none;border-radius: 8px;width: 36px;height: 36px;cursor: pointer;display: flex;align-items: center;justify-content: center;}
        .typing-indicator {display: flex;gap: 4px;padding: 8px 0;}
        .typing-dot {width: 6px;height: 6px;background: var(--text-muted);border-radius: 50%;animation: bounce 1.4s infinite ease-in-out;}
        .typing-dot:nth-child(1) {animation-delay: 0s;} .typing-dot:nth-child(2) {animation-delay: 0.2s;} .typing-dot:nth-child(3) {animation-delay: 0.4s;}
        @keyframes bounce {0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; }}
        .skills-panel {display: none;padding: 24px;overflow-y: auto;}
        .skills-panel.active {display: block;}
        .skill-category {margin-bottom: 24px;}
        .skill-category-title {font-size: 13px;font-weight: 600;color: var(--text-muted);margin-bottom: 12px;}
        .skill-grid {display: grid;grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));gap: 12px;}
        .skill-card {background: var(--bg-card);border: 1px solid var(--border);border-radius: 10px;padding: 16px;cursor: pointer;transition: all 0.2s;}
        .skill-card:hover {border-color: var(--primary);transform: translateY(-2px);}
        .skill-card-title {font-weight: 600;color: white;margin-bottom: 4px;font-size: 14px;}
        .skill-card-desc {font-size: 12px;color: var(--text-muted);}
        ::-webkit-scrollbar {width: 6px;} ::-webkit-scrollbar-thumb {background: var(--border);border-radius: 3px;}
    </style>
</head>
<body>
    <div class="app-container">
        <div class="sidebar">
            <div class="logo"><div class="logo-icon">R</div><div class="logo-text">RedOps</div></div>
            <div class="sidebar-section">
                <div class="sidebar-title">导航</div>
                <div class="sidebar-item active" onclick="switchView('chat')" id="nav-chat">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    <span>对话助手</span>
                </div>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-title">技能</div>
                <div class="sidebar-item" onclick="switchView('skills')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon></svg>
                    <span>技能市场</span>
                </div>
                <div class="sidebar-item" onclick="switchView('targets')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle></svg>
                    <span>目标管理</span>
                </div>
            </div>
            <div class="sidebar-section" style="margin-top: auto;">
                <div class="sidebar-title">系统</div>
                <div class="sidebar-item" onclick="switchView('config')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle></svg>
                    <span>设置</span>
                </div>
                <div class="sidebar-item"><div class="status-dot"></div><span style="font-size: 12px; color: var(--text-muted);">系统在线</span></div>
            </div>
        </div>
        <div class="main-content">
            <div class="header">
                <div class="header-title" id="pageTitle">智能对话</div>
                <div class="header-status"><div class="status-text" id="llmStatus">LLM: 未连接</div></div>
            </div>
            <div class="chat-container" id="chatView">
                <div class="welcome-container" id="welcomeScreen">
                    <div class="welcome-icon">R</div>
                    <div class="welcome-title">RedOps Agent</div>
                    <div class="welcome-subtitle">智能渗透测试助手 - 告诉我您要测试的目标</div>
                    <div class="welcome-input-wrapper">
                        <input type="text" class="welcome-input" id="welcomeInput" placeholder="例如：扫描 example.com 的漏洞" onkeypress="if(event.key==='Enter')sendWelcomeMessage()">
                        <button class="welcome-send" onclick="sendWelcomeMessage()">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                        </button>
                    </div>
                </div>
                <div class="chat-messages" id="chatMessages" style="display: none;"></div>
                <div class="input-container" id="inputContainer" style="display: none;">
                    <div class="input-wrapper">
                        <textarea class="chat-input" id="chatInput" placeholder="输入您的问题或指令..." rows="1" oninput="autoResize()" onkeypress="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
                        <button class="send-btn" onclick="sendMessage()">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                        </button>
                    </div>
                </div>
            </div>
            <div class="skills-panel" id="skillsView"><div id="skillsContainer"></div></div>
            <div class="skills-panel" id="targetsView"><h3 style="margin-bottom: 16px; color: white;">目标管理</h3><p style="color: var(--text-muted);">目标管理功能</p></div>
            <div class="skills-panel" id="configView"><h3 style="margin-bottom: 16px; color: white;">系统设置</h3><p style="color: var(--text-muted);">配置LLM和FOFA API</p></div>
        </div>
    </div>
    <script>
        let sessionId = null, isTyping = false, currentView = 'chat';
        document.addEventListener('DOMContentLoaded', () => {checkLLMStatus();loadSkills();});
        async function checkLLMStatus() {
            try {const r = await fetch('/api/config/llm/status');const d = await r.json();document.getElementById('llmStatus').textContent = d.ready ? `LLM: 已连接` : 'LLM: 未连接';} catch(e) {document.getElementById('llmStatus').textContent = 'LLM: 未连接';}
        }
        async function loadSkills() {
            try {const r = await fetch('/api/skills/');const d = await r.json();const c = document.getElementById('skillsContainer');let h = '';for(const cat of d.categories) {const ss = d.skills.filter(s => s.category === cat);h += `<div class="skill-category"><div class="skill-category-title">${cat}</div><div class="skill-grid">`;for(const s of ss) {h += `<div class="skill-card"><div class="skill-card-title">${s.name}</div><div class="skill-card-desc">${s.description}</div></div>`;}h += '</div></div>';}c.innerHTML = h;} catch(e) {}
        }
        function switchView(view) {currentView = view;document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));document.getElementById('nav-'+view).classList.add('active');const titles = {chat:'智能对话',skills:'技能市场',targets:'目标管理',config:'系统设置'};document.getElementById('pageTitle').textContent = titles[view];document.getElementById('chatView').style.display = view==='chat'?'flex':'none';['skillsView','targetsView','configView'].forEach(v => document.getElementById(v).classList.remove('active'));if(view!=='chat')document.getElementById(view+'View').classList.add('active');}
        function sendWelcomeMessage() {const i = document.getElementById('welcomeInput');if(!i.value.trim())return;document.getElementById('welcomeScreen').style.display='none';document.getElementById('chatMessages').style.display='block';document.getElementById('inputContainer').style.display='block';document.getElementById('chatInput').value=i.value;sendMessage();}
        async function sendMessage() {const i = document.getElementById('chatInput');const m=i.value.trim();if(!m||isTyping)return;document.getElementById('welcomeScreen').style.display='none';document.getElementById('chatMessages').style.display='block';document.getElementById('inputContainer').style.display='block';addMessage('user',m);i.value='';i.style.height='auto';isTyping=true;showTyping();scrollToBottom();try{const r=await fetch('/api/chat/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m,session_id:sessionId})});const d=await r.json();hideTyping();sessionId=d.session_id;addMessage('assistant',d.message);}catch(e){hideTyping();addMessage('assistant','错误: '+e.message);}isTyping=false;}
        function addMessage(role,content){const c=document.getElementById('chatMessages');const t=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});c.innerHTML+=`<div class="message"><div class="message-avatar ${role}">${role==='user'?'U':'R'}</div><div class="message-content"><div class="message-header"><span class="message-name">${role==='user'?'您':'RedOps'}</span><span class="message-time">${t}</span></div><div class="message-text">${content.replace(/\n/g,'<br>').replace(/`(.*?)`/g,'<code>$1</code>')}</div></div></div>`;}
        function showTyping(){const c=document.getElementById('chatMessages');c.innerHTML+=`<div class="message" id="typingIndicator"><div class="message-avatar assistant">R</div><div class="message-content"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div></div>`;}
        function hideTyping(){const t=document.getElementById('typingIndicator');if(t)t.remove();}
        function scrollToBottom(){document.getElementById('chatMessages').scrollTop=document.getElementById('chatMessages').scrollHeight;}
        function autoResize(){const i=document.getElementById('chatInput');i.style.height='auto';i.style.height=Math.min(i.scrollHeight,120)+'px';}
    </script>
</body>
</html>
